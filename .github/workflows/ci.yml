name: CI

# The gate is the only check. It runs here exactly as it does on a laptop, so a
# local pass means a green run, and nothing here needs a GPU, FlashRAG or vLLM.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the older run irrelevant; cancelling it
# keeps the free runner pool and the checks list readable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The guards diff against a base commit, so the history must be there.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install gate requirements
        run: pip install -r requirements-ci.txt

      - name: Run the gate
        run: bash scripts/gate.sh
        env:
          # On a pull request the guards diff against the base branch's merge base.
          # On a push to main they diff against the previous main tip, so every
          # commit in the push is examined, not just the last one.
          GUARD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          # Branch protection is unavailable to this team, so on a push to main the
          # guards also require every new commit to come from a pull request.
          MAIN_MERGE_POLICY: ${{ github.event_name == 'push' && '1' || '0' }}
